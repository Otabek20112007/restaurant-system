{% extends 'dashboard/base.html' %}

{% block title %}Удалить блюдо{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Удалить блюдо?</h1>
</div>

<div class="stat-card">
    <p>Вы собираетесь удалить блюдо <strong>«{{ item.name }}»</strong> из категории «{{ item.category.name }}».</p>
    <p class="text-muted">Это действие нельзя отменить.</p>
    
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'dashboard:menu' %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
